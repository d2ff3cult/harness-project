name: CI

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run gate
        run: pnpm ci:gate

      - name: Install Playwright browser
        run: pnpm visual:install-browsers

      - name: Capture current screenshots
        run: pnpm visual:capture:current

      - name: Visual regression (block mode)
        run: VISUAL_GATE_MODE=block pnpm visual:regression
